[pytest]
addopts = --import-mode=importlib -ra
testpaths = tests libs core witness cli
pythonpath = core/tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    integration: cần dịch vụ thật (PostgreSQL, OpenBao, ClamAV) từ deploy/compose.test.yaml
    infra: cần toàn bộ stack đang chạy (make up)
    e2e: luồng đầu-cuối M1 trên stack thật (ops/e2e/run_e2e.sh)
