#
# Hằng đêm (02:00 giờ Việt Nam): kiểm dịch với ClamAV THẬT (image đã ghim trong deploy/compose.yaml),
# thay cho fake-av của CI thường (Plan 01 Task 14 Step 4; spec 16.1).
name: nightly
on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-clamav:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DXOS_TEST_REQUIRE_DB: "1"
      DXOS_TEST_CLAMD: "127.0.0.1:53311"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: ClamAV thật (chờ tải chữ ký, tối đa 15 phút)
        run: |
          docker run -d --name clamav -p 127.0.0.1:53311:3310 \
            clamav/clamav:1.4@sha256:3bba6dd5ac6663d55b80f86a3126e146612d93b593cc2617188d13f637d91260
          for i in $(seq 180); do
            if printf 'zPING\0' | timeout 2 nc 127.0.0.1 53311 | grep -q PONG; then echo "clamd sẵn sàng"; exit 0; fi
            sleep 5
          done
          docker logs clamav | tail -50; exit 1
      - run: docker compose -f deploy/compose.test.yaml up -d --wait core-db seaweedfs openbao
      - run: make dev-install
      - run: python -m pytest -m integration --real-clamav core/tests/integration/test_ingest.py -v
