name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  reuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - run: python -m pip install reuse
      - run: reuse lint

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - run: python -m pip install ruff
      - run: ruff check .

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - run: make dev-install
      - run: python -m pytest -m "not integration and not infra" --junitxml=unit-junit.xml
      # Khi đỏ: đẩy tên test lỗi + phiên bản Python lên annotation (đọc được qua API check-runs khi log bị chặn).
      - name: Annotate failures
        if: failure()
        run: |
          python -V | sed 's/^/::notice title=python::/'
          python - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          for f in glob.glob("unit-junit.xml"):
              for case in ET.parse(f).getroot().iter("testcase"):
                  for bad in list(case.findall("failure")) + list(case.findall("error")):
                      msg = " ".join((bad.get("message") or "").split())[:300]
                      print(f"::error title={case.get('classname')}::{case.get('name')}: {msg}")
          PY

  # Workspace npm (SDK, cổng xác minh, ứng dụng Tầng 2): typecheck + test đơn vị + build. npm ghim 11.6.2 (npm 10 lỗi khi cài bộ phụ thuộc này).
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "22" }
      - run: npm i -g npm@11.6.2
      - run: npm ci
      - run: npm run check
      # Bộ kiểm trình duyệt thật (tests/web/live): chỉ kiểm kiểu và xác nhận bị bỏ qua khi không có DXOS_WEB_LIVE=1.
      - run: npm run typecheck:live
      - run: npm run test:live
      # Cổng đối soát (AT-25): Playwright chạy bản build thật với API giả; trình duyệt cài bằng lệnh dưới.
      - run: npx playwright install --with-deps chromium
      - run: npx -w dxos-verify-portal playwright test

  # Giấy phép gói bên thứ ba (Plan 04 Task 1): cài đúng bộ runtime theo constraints.txt (chứng minh các ghim cài được),
  # rồi quét Python (importlib.metadata) và npm (package-lock.json). Ngoại lệ ở LICENSES-THIRD-PARTY.md.
  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - run: python -m pip install -c constraints.txt -e libs/dxos-proof -e core -e witness -e cli -e viewer
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "22" }
      - run: npm i -g npm@11.6.2
      - run: npm ci
      - run: python ops/license_scan.py

  integration:
    runs-on: ubuntu-latest
    env:
      DXOS_TEST_REQUIRE_DB: "1"   # không có DB thì báo lỗi, không bỏ qua
      DXOS_TEST_FLOWABLE_URL: http://127.0.0.1:58080/flowable-rest/service
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - run: docker compose -f deploy/compose.test.yaml up -d --wait core-db seaweedfs openbao flowable
      - name: Chờ Flowable REST trả lời (healthcheck compose mới chỉ kiểm cổng)
        run: |
          for i in $(seq 1 60); do
            curl -fsS -u rest-admin:changeme-test "$DXOS_TEST_FLOWABLE_URL/management/engine" && exit 0
            sleep 2
          done
          echo "Flowable không sẵn sàng sau 120 giây" >&2
          exit 1
      - run: make dev-install
      - run: python -m pytest -m integration -v

  # Kiểm sống Caddyfile thật (danh sách IP host quản trị trả 403, spec 6.2): cần binary Caddy, ghim đúng 2.10.0.
  caddy-live:
    runs-on: ubuntu-latest
    env:
      CADDY_VERSION: "2.10.0"
      DXOS_REQUIRE_CADDY: "1"   # thiếu/hỏng Caddy thì test sống LỖI, không bỏ qua
      # sha512 của caddy_2.10.0_linux_amd64.tar.gz theo tệp checksums của bản phát hành (kiểm cả hai nguồn).
      CADDY_SHA512: 626682d623ca04356ab3c9a93a82386cfde6d8243b11f2d0eea9e97ba630c7ada62373401e96b72c6690c98ae8dd004d61fafe477f5249690d5cb251ebbfd2d9
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: Tải Caddy ${{ env.CADDY_VERSION }} và kiểm sha512 theo tệp checksums của bản phát hành
        run: |
          base="https://github.com/caddyserver/caddy/releases/download/v${CADDY_VERSION}"
          tarball="caddy_${CADDY_VERSION}_linux_amd64.tar.gz"
          mkdir -p "$RUNNER_TEMP/caddy" && cd "$RUNNER_TEMP/caddy"
          curl -fsSLO "$base/$tarball"
          curl -fsSLO "$base/caddy_${CADDY_VERSION}_checksums.txt"
          grep " $tarball\$" "caddy_${CADDY_VERSION}_checksums.txt" | sha512sum -c -
          echo "$CADDY_SHA512  $tarball" | sha512sum -c -
          tar -xzf "$tarball" caddy
          ./caddy version | grep -F "v${CADDY_VERSION}"
          echo "CADDY_BIN=$PWD/caddy" >> "$GITHUB_ENV"
      - run: make dev-install
      - run: python -m pytest tests/deploy/test_caddy_admin_allowlist_live.py -v

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - name: gitleaks (image Docker, không dùng gitleaks-action)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.18.4 detect --source /repo --redact --verbose --report-format json --report-path /repo/gitleaks-report.json
      # Khi đỏ: đẩy vị trí phát hiện (đã che bí mật) lên annotation.
      - name: Annotate findings
        if: failure()
        run: |
          python3 - <<'PY'
          import json
          try:
              for f in json.load(open("gitleaks-report.json")) or []:
                  print(f"::error file={f['File']},line={f['StartLine']},title=gitleaks {f['RuleID']}::commit {f['Commit'][:7]}")
          except OSError:
              print("::error::gitleaks không ghi báo cáo")
          PY
