#
# Cấu hình gitleaks (job `secrets` trong .github/workflows/ci.yml; quét toàn bộ lịch sử git).
title = "DX-OS gitleaks"

[extend]
useDefault = true

[allowlist]
description = "Chỉ cho phép đúng một mật khẩu thử nghiệm cố định trong bài test, không phải bí mật thật"
# Không đặt `paths` ở đây: trong gitleaks v8.18 các điều kiện của allowlist toàn cục là OR, nên thêm `paths` sẽ miễn trừ
# cả tệp cho mọi luật. Chỉ so theo chuỗi.
regexes = ['''mat-khau-thu-nghiem-9f3a''']
