target-version = "py312"
line-length = 110

[lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]  # assert được phép trong test

[lint.per-file-ignores]
# Chuỗi mẫu trong test (CCCD giả, mật khẩu changeme của DB test) không phải bí mật thật.
"**/tests/**" = ["S105", "S106"]
