# Manifest tổng hợp chỉ để kiểm thử lõi (D6): lõi không bao giờ được thử bằng manifest của App A/B.
apiVersion: dxos/v1
app: { id: test-app, version: 0.1.0, name: "Test app", spaces: [D] }
roles: [member, reviewer]
collections:
  item:
    fields:
      title:       { type: string, public: true }
      secret_code: { type: string, pii: CCCD }
    attachments: { kinds: [pdf], max_mb: 1 }
    access: { read: [owner, role:reviewer], create: [role:member], update: [owner] }
policies:
  pii: { reveal_roles: [reviewer] }
