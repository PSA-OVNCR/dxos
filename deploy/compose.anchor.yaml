# Overlay bật neo STH lên repo GitHub (docs/runbook-anchor.md). Dùng kèm compose.yaml + một hồ sơ:
#   docker compose -p dxos --env-file .env -f deploy/compose.yaml -f deploy/compose.p16.yaml -f deploy/compose.anchor.yaml up -d
# Cần .env có DXOS_ANCHOR_REMOTE và tệp .secrets/anchor-deploy-key (khóa riêng của deploy key, quyền ghi).
services:
  trust-core-worker:
    environment:
      DXOS_ANCHOR_REMOTE: ${DXOS_ANCHOR_REMOTE:?đặt DXOS_ANCHOR_REMOTE trong .env}
    secrets: [s3-access-key, s3-secret-key, openbao-core-token, actor-hmac-key, anchor-deploy-key]

secrets:
  anchor-deploy-key:
    file: ../.secrets/anchor-deploy-key
