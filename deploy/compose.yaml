#
# Stack DX-OS Trust Core: tệp nền. Luôn dùng kèm một hồ sơ:
#   docker compose -p dxos --env-file .env -f deploy/compose.yaml -f deploy/compose.p16.yaml up -d
# Phân vùng mạng phải khớp deploy/network-matrix.yaml (kiểm bởi tests/infra/test_compose_static.py).
# Image ghim digest bằng `python ops/pin_images.py`.

name: dxos

x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

x-pg-health: &pg-health
  test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
  interval: 10s
  timeout: 5s
  retries: 10

# Cấu hình chung của trust-core-api và trust-core-worker (dxos_core.settings.Settings, tiền tố DXOS_).
# Bí mật không nằm trong biến môi trường: đọc từ /run/secrets/<tên> (khối `secrets:` cuối tệp).
x-core-env: &core-env
  DXOS_DATABASE_URL: postgresql://dxos_core:${CORE_DB_APP_PASSWORD:?đặt CORE_DB_APP_PASSWORD trong .env}@core-db:5432/dxos
  DXOS_S3_ENDPOINT: http://seaweedfs:8333
  DXOS_S3_ACCESS_KEY_FILE: /run/secrets/s3-access-key
  DXOS_S3_SECRET_KEY_FILE: /run/secrets/s3-secret-key
  DXOS_OPENBAO_TOKEN_FILE: /run/secrets/openbao-core-token
  DXOS_KEYCLOAK_ISSUER: https://${DXOS_DOMAIN:?đặt DXOS_DOMAIN trong .env}/auth/realms/dxos
  DXOS_KEYCLOAK_JWKS_URL: http://keycloak:8080/auth/realms/dxos/protocol/openid-connect/certs
  DXOS_ACTOR_HMAC_KEY_FILE: /run/secrets/actor-hmac-key
  DXOS_ANCHOR_REPO_DIR: /var/lib/dxos/anchor-repo

x-core-secrets: &core-secrets [s3-access-key, s3-secret-key, openbao-core-token, actor-hmac-key]

services:
  # ---------- Lối vào ----------
  caddy:
    <<: *common
    image: caddy:2.10@sha256:c3d7ee5d2b11f9dc54f947f68a734c84e9c9666c92c88a7f30b9cba5da182adb
    ports:
      - "80:80"
      - "443:443"
    environment:
      DXOS_DOMAIN: ${DXOS_DOMAIN:?đặt DXOS_DOMAIN trong .env}
      DXOS_ADMIN_HOST: ${DXOS_ADMIN_HOST:?đặt DXOS_ADMIN_HOST trong .env}
      DXOS_ADMIN_ALLOWED_IPS: ${DXOS_ADMIN_ALLOWED_IPS:?đặt DXOS_ADMIN_ALLOWED_IPS trong .env}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - apps-static:/srv/apps:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [net-edge, net-front]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 5

  apisix:
    <<: *common
    image: apache/apisix:3.12.0-debian@sha256:83e70a2a1aff751c17cbf7f876e53fd37fbfcd4f0bc13748effc2cd8c86802ab
    environment:
      DXOS_ADMIN_HOST: ${DXOS_ADMIN_HOST:?đặt DXOS_ADMIN_HOST trong .env}
      APISIX_OIDC_CLIENT_SECRET: ${APISIX_OIDC_CLIENT_SECRET:?đặt APISIX_OIDC_CLIENT_SECRET trong .env}
    volumes:
      - ./apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    networks: [net-front, net-app]
    healthcheck:
      # Image APISIX (Debian) không có curl/wget: dùng /dev/tcp của bash.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9080"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ---------- Danh tính ----------
  keycloak:
    <<: *common
    image: quay.io/keycloak/keycloak:26.3@sha256:357829ec7c4693397533035092ad13b0644bcc95ded311f33a3738c4d9e9bdba
    # Nạp realm dxos khi khởi động lần đầu (bỏ qua nếu realm đã có trong kc-db).
    command: ["start", "--import-realm"]
    volumes:
      - ./keycloak/realm-dxos.json:/opt/keycloak/data/import/realm-dxos.json:ro
    environment:
      # Biến được thay vào realm-dxos.json lúc nạp (${...}); secret không nằm trong repo.
      DXOS_DOMAIN: ${DXOS_DOMAIN}
      APISIX_OIDC_CLIENT_SECRET: ${APISIX_OIDC_CLIENT_SECRET:?đặt APISIX_OIDC_CLIENT_SECRET trong .env}
      DXOS_INSTALLER_CLIENT_SECRET: ${DXOS_INSTALLER_CLIENT_SECRET:?đặt DXOS_INSTALLER_CLIENT_SECRET trong .env}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://kc-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?đặt KC_DB_PASSWORD trong .env}
      # Keycloak chạy dưới /auth cả bên trong lẫn bên ngoài (Caddy KHÔNG cắt tiền tố),
      # để URL backchannel (token_endpoint...) luôn đúng.
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: https://${DXOS_DOMAIN}/auth
      KC_HOSTNAME_ADMIN: https://${DXOS_ADMIN_HOST}/auth
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?đặt KEYCLOAK_ADMIN_PASSWORD trong .env}
    depends_on:
      kc-db: {condition: service_healthy}
    networks: [net-front, net-idp, net-kcdb]
    healthcheck:
      # Image Keycloak không có curl/wget: dùng /dev/tcp của bash tới cổng quản trị 9000.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /auth/health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  kc-db:
    <<: *common
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:?đặt KC_DB_PASSWORD trong .env}
    volumes: [kc-db-data:/var/lib/postgresql/data]
    networks: [net-kcdb]
    healthcheck: *pg-health

  # ---------- Lõi Tầng 1 (image build từ core/Dockerfile, ảnh nền ghim digest) ----------
  trust-core-api:
    <<: *common
    build: &core-build
      context: ..
      dockerfile: core/Dockerfile
    environment:
      <<: *core-env
      # Chỉ dùng lúc khởi động để chạy migration; entrypoint xóa 2 biến này trước khi exec uvicorn.
      DXOS_MIGRATE_DATABASE_URL: postgresql://dxos_owner:${CORE_DB_OWNER_PASSWORD:?đặt CORE_DB_OWNER_PASSWORD trong .env}@core-db:5432/dxos
      DXOS_CORE_DB_PASSWORD: ${CORE_DB_APP_PASSWORD:?đặt CORE_DB_APP_PASSWORD trong .env}
    secrets: *core-secrets
    depends_on:
      core-db: {condition: service_healthy}
    networks: [net-app, net-idp, net-wf, net-data]
    healthcheck:
      # /readyz: DB kết nối được và đã có migration.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  trust-core-worker:
    <<: *common
    build: *core-build
    command: ["python", "-m", "dxos_core.worker"]
    environment: *core-env
    secrets: *core-secrets
    depends_on:
      trust-core-api: {condition: service_healthy}   # migration đã chạy xong
    networks: [net-data, net-egress]
    healthcheck:
      # Worker ghi heartbeat mỗi 5 giây khi DB trả lời; quá 60 giây là hỏng.
      test: ["CMD", "python", "-m", "dxos_core.worker", "--check"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Đứng thay viewer / backend Tầng 2 trong vùng API, để AT-01 có điểm xuất phát thật.
  net-probe-app:
    <<: *common
    image: busybox:1.37@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
    command: ["sleep", "infinity"]
    networks: [net-app]
    healthcheck:
      test: ["CMD", "true"]
      interval: 60s

  # ---------- Workflow ----------
  flowable:
    <<: *common
    image: flowable/flowable-rest:7.1.0@sha256:b7ae287502cd5c243b577a0ca2894172e1c18cd75aea4fd67dc7d58f1b40db44
    environment:
      SPRING_DATASOURCE_DRIVER-CLASS-NAME: org.postgresql.Driver
      SPRING_DATASOURCE_URL: jdbc:postgresql://flowable-db:5432/flowable
      SPRING_DATASOURCE_USERNAME: flowable
      SPRING_DATASOURCE_PASSWORD: ${FLOWABLE_DB_PASSWORD:?đặt FLOWABLE_DB_PASSWORD trong .env}
      FLOWABLE_REST_APP_ADMIN_USER-ID: ${FLOWABLE_REST_USER:-rest-admin}
      FLOWABLE_REST_APP_ADMIN_PASSWORD: ${FLOWABLE_REST_PASSWORD:?đặt FLOWABLE_REST_PASSWORD trong .env}
    depends_on:
      flowable-db: {condition: service_healthy}
    networks: [net-wf, net-fldb]
    healthcheck:
      # Image Flowable (Alpine) không có bash/curl; có nc. Actuator đòi xác thực nên chỉ kiểm cổng.
      test: ["CMD", "nc", "-z", "127.0.0.1", "8080"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  flowable-db:
    <<: *common
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: flowable
      POSTGRES_USER: flowable
      POSTGRES_PASSWORD: ${FLOWABLE_DB_PASSWORD:?đặt FLOWABLE_DB_PASSWORD trong .env}
    volumes: [flowable-db-data:/var/lib/postgresql/data]
    networks: [net-fldb]
    healthcheck: *pg-health

  # ---------- Vùng dữ liệu (chỉ trust-core thấy) ----------
  core-db:
    <<: *common
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: dxos
      POSTGRES_USER: dxos_owner
      POSTGRES_PASSWORD: ${CORE_DB_OWNER_PASSWORD:?đặt CORE_DB_OWNER_PASSWORD trong .env}
    volumes: [core-db-data:/var/lib/postgresql/data]
    networks: [net-data]
    healthcheck: *pg-health

  seaweedfs:
    <<: *common
    image: chrislusf/seaweedfs:3.80@sha256:1055999e08eed1789b0ae45d235126e4495e23d3fb9d6396293fd42539b1ae6a
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-volume.max=0"]
    volumes: [seaweedfs-data:/data]
    networks: [net-data]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9333/cluster/status"]
      interval: 15s
      timeout: 5s
      retries: 10

  clamav:
    <<: *common
    image: clamav/clamav:1.4@sha256:3bba6dd5ac6663d55b80f86a3126e146612d93b593cc2617188d13f637d91260
    volumes: [clamav-db:/var/lib/clamav]
    networks: [net-data, net-egress]
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s

  openbao:
    <<: *common
    image: openbao/openbao:2.2.0@sha256:19612d67a4a95d05a7b77c6ebc6c2ac5dac67a8712d8df2e4c31ad28bee7edaa
    command: ["server", "-config=/openbao/dxos/openbao.hcl"]
    environment:
      BAO_ADDR: http://127.0.0.1:8200     # cho lệnh `bao` chạy bằng docker compose exec (runbook)
    volumes:
      # openbao.hcl + init.sh + dxos-core-policy.hcl (docs/runbook-openbao.md)
      - ./openbao:/openbao/dxos:ro
      - openbao-data:/openbao/file
    networks: [net-data]
    healthcheck:
      # Sống là đủ; init/unseal do Task 15 đảm nhiệm.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8200/v1/sys/health?uninitcode=200&sealedcode=200&standbyok=true"]
      interval: 15s
      timeout: 5s
      retries: 10

networks:
  net-edge:   {internal: false}
  net-front:  {internal: true}
  net-app:    {internal: true}
  net-idp:    {internal: true}
  net-kcdb:   {internal: true}
  net-wf:     {internal: true}
  net-fldb:   {internal: true}
  net-data:   {internal: true}
  net-egress: {internal: false}

# Docker secret lấy giá trị từ biến trong .env; container đọc ở /run/secrets/<tên>.
secrets:
  s3-access-key:      {environment: S3_ACCESS_KEY}
  s3-secret-key:      {environment: S3_SECRET_KEY}
  openbao-core-token: {environment: OPENBAO_CORE_TOKEN}
  actor-hmac-key:     {environment: DXOS_ACTOR_HMAC_KEY}

volumes:
  apps-static:
  caddy-data:
  caddy-config:
  kc-db-data:
  flowable-db-data:
  core-db-data:
  seaweedfs-data:
  clamav-db:
  openbao-data:
