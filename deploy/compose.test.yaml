#
# Dịch vụ cho integration test (marker `integration`), dự án riêng `dxos-test`.
# CHỈ DÙNG KHI PHÁT TRIỂN/CI: OpenBao chạy chế độ dev, cổng chỉ mở trên 127.0.0.1.
#   docker compose -f deploy/compose.test.yaml up -d --wait
name: dxos-test

x-test: &test
  labels:
    dxos.dev-only: "true"

services:
  core-db:
    <<: *test
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: dxos_test
      POSTGRES_USER: dxos_owner
      POSTGRES_PASSWORD: changeme-test
    ports: ["127.0.0.1:55432:5432"]
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dxos_owner -d dxos_test"]
      interval: 2s
      retries: 30

  openbao:
    <<: *test
    image: openbao/openbao:2.2.0@sha256:19612d67a4a95d05a7b77c6ebc6c2ac5dac67a8712d8df2e4c31ad28bee7edaa
    command: ["server", "-dev", "-dev-root-token-id=changeme-test-root", "-dev-listen-address=0.0.0.0:8200"]
    ports: ["127.0.0.1:58200:8200"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8200/v1/sys/health"]
      interval: 2s
      retries: 30

  clamav:
    <<: *test
    build: ./fake-av
    ports: ["127.0.0.1:53310:3310"]
    healthcheck:
      test: ["CMD", "python", "/app/fake_av.py", "--ping"]
      interval: 2s
      retries: 30

  seaweedfs:
    <<: *test
    image: chrislusf/seaweedfs:3.80@sha256:1055999e08eed1789b0ae45d235126e4495e23d3fb9d6396293fd42539b1ae6a
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-volume.max=0"]
    ports: ["127.0.0.1:58333:8333"]
    tmpfs: [/data]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9333/cluster/status"]
      interval: 2s
      retries: 30

  # Flowable REST 7.1.0 (cùng image ghim digest với production) chạy H2 mặc định của image (không đặt SPRING_DATASOURCE_*), không cần DB riêng.
  # Dữ liệu sống đến khi container dừng và dùng chung giữa các lần chạy test: test phải chịu được dữ liệu cũ.
  # Healthcheck chỉ kiểm cổng (image Alpine có nc; actuator đòi xác thực); CI còn gọi thử REST (xem ci.yml).
  flowable:
    <<: *test
    image: flowable/flowable-rest:7.1.0@sha256:b7ae287502cd5c243b577a0ca2894172e1c18cd75aea4fd67dc7d58f1b40db44
    environment:
      FLOWABLE_REST_APP_ADMIN_USER-ID: rest-admin
      FLOWABLE_REST_APP_ADMIN_PASSWORD: changeme-test
      JAVA_TOOL_OPTIONS: "-Xmx384m"
    ports: ["127.0.0.1:58080:8080"]
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8080"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 20s
