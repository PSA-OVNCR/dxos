# Overlay PHÁT HÀNH (Plan 02 Task 15, AT-13; Plan 04 Task 15, ruling R28): trust-core-api và trust-core-worker chạy đúng
# image trust-core đã phát hành trên GHCR, ghim theo digest; viewer (nếu hồ sơ bật nó) chạy đúng image viewer đã phát hành,
# cũng theo digest; không build từ mã nguồn trên máy chủ. Dùng chồng lên compose.yaml + một hồ sơ:
#   docker compose -p dxos --env-file .env -f deploy/compose.yaml -f deploy/compose.p16.yaml \
#     -f deploy/compose.release.yaml up -d
# DXOS_TRUST_CORE_DIGEST và DXOS_VIEWER_DIGEST (64 hex, không có tiền tố sha256:) lấy từ trang GitHub Release của tag
# (tệp trust-core-image-X.Y.Z.txt và viewer-image-X.Y.Z.txt), đặt trong .env; ops/deploy.sh tự đọc và ghi chúng vào
# deploy/release.env.
# DXOS_VIEWER_DIGEST chỉ cần khi hồ sơ `viewer` bật (COMPOSE_PROFILES=viewer, chỉ p16). Compose nội suy biến của MỌI dịch vụ
# kể cả dịch vụ ngoài hồ sơ nên `${...:?}` sẽ làm p8 và dev-lite phải đặt một digest không dùng; vì vậy biến để mặc định
# là một chuỗi KHÔNG phải digest: thiếu biến mà hồ sơ `viewer` bật thì tham chiếu image sai và `compose pull/up` không
# kéo được, còn `build` đã bị bỏ nên không có đường rơi về dựng từ mã nguồn (chưa thử với daemon thật: V40). ops/deploy.sh
# từ chối trước đó, thoát mã 3 khi không đọc được digest Viewer.
# Không dùng anchor YAML: compose v2 làm mất tag !reset khi đi qua alias (build còn nguyên, máy chủ sẽ build từ nguồn).
services:
  trust-core-api:
    image: ghcr.io/psa-ovncr/trust-core@sha256:${DXOS_TRUST_CORE_DIGEST:?đặt DXOS_TRUST_CORE_DIGEST (digest trên trang Release) trong .env}
    build: !reset null
    pull_policy: missing
  trust-core-worker:
    image: ghcr.io/psa-ovncr/trust-core@sha256:${DXOS_TRUST_CORE_DIGEST:?đặt DXOS_TRUST_CORE_DIGEST (digest trên trang Release) trong .env}
    build: !reset null
    pull_policy: missing
  # Viewer (Plan 04 Task 8, S2): chỉ hồ sơ p16 dựng nó (compose.p8.yaml, compose.dev-lite.yaml đổi profile của dịch vụ này).
  viewer:
    image: ghcr.io/psa-ovncr/viewer@sha256:${DXOS_VIEWER_DIGEST:-dat-DXOS_VIEWER_DIGEST-trong-env}
    build: !reset null
    pull_policy: missing
