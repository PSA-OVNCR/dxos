# clamd cho hồ sơ p8 (spec 16.1). Các giá trị khác giữ mặc định của ClamAV.
Foreground yes
LogFile /var/log/clamav/clamd.log
LogTime yes
LocalSocket /tmp/clamd.sock
TCPSocket 3310
TCPAddr 0.0.0.0
DatabaseDirectory /var/lib/clamav
ConcurrentDatabaseReload no
MaxThreads 1
StreamMaxLength 50M
