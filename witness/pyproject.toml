[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dxos-witness"
version = "0.3.0"
description = "Independent witness for the DX-OS transparency log: checks signed tree heads and consistency proofs"
license = "Apache-2.0"
requires-python = ">=3.12"
# dxos-proof cài từ thư mục libs/dxos-proof (make dev-install). Không phụ thuộc dxos-core: witness phải độc lập.
dependencies = [
    "dxos-proof",
    "httpx>=0.27",
    "cryptography>=43",
]

[project.scripts]
dxos-witness = "dxos_witness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
